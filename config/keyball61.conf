# 右手単体で動かすため、分割キーボード通信（スプリット）を無効にする
# 非分割設定（n）にすることで、自動的にPC/スマホと直接Bluetooth・USB通信する単体キーボードになります
CONFIG_ZMK_SPLIT=n

# BluetoothとUSBのコア機能を有効化
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# システムライブラリ(picolibc)で拡張文字列処理関数(snprintfなど)を正常に有効化する
CONFIG_PICOLIBC_IO_LONG_LONG=y

# ZMK Studio 設定
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

# Bluetooth 送信電波の出力を最大（+8dBm）に引き上げる（nRF52840標準は0dBm）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 接続パラメータの安定化（Windows 11 等での瞬断防止）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n



# OLEDディスプレイ・LVGL描画の有効化（砂嵐防止）
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_BT_CTLR_PHY_2M=n

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
