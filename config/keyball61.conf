# 右手単体（非スプリット）として動作させる設定
CONFIG_ZMK_SPLIT=n

# BluetoothとUSBのコア機能を有効化
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# ZMK Studio の有効化（ロックなし）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

# 拡張文字列処理関数の有効化
CONFIG_PICOLIBC_IO_LONG_LONG=y

# Bluetooth 送信電波の出力を最大（+8dBm）に引き上げ
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 【追加】サスペンド復帰時のBLEネゴシエーション失敗を防ぐ
CONFIG_BT_CTLR_PHY_2M=n

# 【追加】ディープスリープによるコールドブート（再起動）を防ぐ
CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
